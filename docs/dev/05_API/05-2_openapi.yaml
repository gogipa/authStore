          description: '`ALREADY_IN_PROGRESS`(details.job=KEYWORD_COLLECTION) — 수집 중. `EXTERNAL_CALL_COOLDOWN`(details.target=DATALAB, blockedUntil, Retry-After) — 403·418·429 뒤 24시간 쉼(BUTTON만)'
