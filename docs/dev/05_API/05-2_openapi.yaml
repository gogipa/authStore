    PrerequisiteCheck:
      type: object
      description: 사전조건 항목의 현재 상태(prerequisite_check)
      required:
      - item
      - status
      - method
      - detail
      - checkedAt
      properties:
        item:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          maxLength: 40
          description: 항목 코드(제안값, 예 COMMERCE_API_APP, OVERSEAS_ADDRESSBOOK, AI_CLI, PC_CLOCK)
        status:
          type: string
          description: CONFIRMED=확인됨, UNCONFIRMED=미확인, FAILED=실패
          enum:
          - CONFIRMED
          - UNCONFIRMED
          - FAILED
        method:
          type: string
          description: AUTO=앱이 점검, MANUAL=오너가 표시
          enum:
          - AUTO
          - MANUAL
        detail:
          type:
          - string
          - 'null'
          description: 한국어 안내·실패 사유(비밀 없음)
        checkedAt:
          type:
          - string
          - 'null'
          format: date-time
    PrerequisiteCheckList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PrerequisiteCheck'
    PrerequisiteCheckUpdateRequest:
      type: object
      required:
      - confirmed
      properties:
        confirmed:
          type: boolean
          description: true면 CONFIRMED, false면 UNCONFIRMED
    InstallNoticeConsent:
      type: object
      description: 이용 고지 동의 기록(install_notice_consent, 고지 버전마다 1행)
      required:
      - id
      - noticeVersion
      - appVersion
      - consentedAt
      properties:
        id:
          type: integer
          minimum: 1
        noticeVersion:
          type: string
          maxLength: 40
        appVersion:
          type: string
          maxLength: 40
        consentedAt:
          type: string
          format: date-time
    InstallNoticeConsentRequest:
      type: object
      required:
      - noticeVersion
      properties:
        noticeVersion:
          type: string
          minLength: 1
          maxLength: 40
          description: 화면에 보여 준 고지 버전
    InstallInfo:
      type: object
      description: 설치본 정보(install_info 1행 + 동의 기록 + 앱 내장 값). data_dir_path는 개인 경로라 주지 않는다
      required:
      - appVersion
      - firstRunAt
      - lastRunAppVersion
      - autoUpdateCheckEnabled
      - currentNoticeVersion
      - consentRequired
      - latestConsent
      - changelog
      properties:
        appVersion:
          type: string
          maxLength: 40
          description: 지금 실행 중인 앱 버전
        firstRunAt:
          type:
          - string
          - 'null'
          format: date-time
        lastRunAppVersion:
          type:
          - string
          - 'null'
          maxLength: 40
        autoUpdateCheckEnabled:
          type: boolean
          description: 기본 false
        currentNoticeVersion:
          type: string
          maxLength: 40
          description: 앱에 내장된 현재 이용 고지 버전
        consentRequired:
          type: boolean
          description: 현재 고지 버전에 동의한 기록이 없음
        latestConsent:
          description: 가장 최근 동의 기록(없으면 null)
          oneOf:
          - $ref: '#/components/schemas/InstallNoticeConsent'
          - type: 'null'
        changelog:
          type: string
          description: 앱 내장 변경 내역(Markdown 원문)
    AutoUpdateCheckSetting:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: 새 버전 자동 확인 켜기(install_info.auto_update_check_enabled)
    AppUpdateCheckResult:
      type: object
      required:
      - currentVersion
      - latestVersion
      - updateAvailable
      - checkedAt
      properties:
        currentVersion:
          type: string
          maxLength: 40
        latestVersion:
          type:
          - string
          - 'null'
          maxLength: 40
        updateAvailable:
          type: boolean
        checkedAt:
          type: string
          format: date-time
    CredentialKind:
      type: string
      description: 자격증명 종류(credential_lifecycle.credential_kind, GEN-05). RAKUTEN_APP=라쿠텐 앱, COMMERCE_MANAGER_AUTH=커머스API 통합매니저 인증, KOREAEXIM_API_KEY=수출입은행 키
      enum:
      - RAKUTEN_APP
      - COMMERCE_MANAGER_AUTH
      - KOREAEXIM_API_KEY
    CredentialLifecycle:
      type: object
      description: 자격증명 종류별 기한(비밀값은 키체인)
      required:
      - credentialKind
      - expiresOn
      - note
      - daysRemaining
      - warningLevel
      properties:
        credentialKind:
          $ref: '#/components/schemas/CredentialKind'
        expiresOn:
          type:
          - string
          - 'null'
          format: date
          description: 입력하지 않았으면 null
        note:
          type:
          - string
          - 'null'
          maxLength: 500
        daysRemaining:
          type:
          - integer
          - 'null'
          description: 오늘(KST)부터 남은 일수(지났으면 음수)
        warningLevel:
          type: string
          description: UNSET=기한 미입력, NONE=30일 넘게 남음, WITHIN_30_DAYS, WITHIN_7_DAYS, EXPIRED(계산값)
          enum:
          - UNSET
          - NONE
          - WITHIN_30_DAYS
          - WITHIN_7_DAYS
          - EXPIRED
    CredentialLifecycleList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CredentialLifecycle'
    CredentialLifecycleUpdateRequest:
      type: object
      required:
      - expiresOn
      properties:
        expiresOn:
          type: string
          format: date
        note:
          type:
          - string
          - 'null'
          maxLength: 500
    CredentialAlert:
      type: object
      description: 만료 경고 이력(credential_alert)
      required:
      - id
      - credentialLifecycleId
      - credentialKind
      - expiresOn
      - thresholdDays
      - alertedAt
      properties:
        id:
          type: integer
          minimum: 1
        credentialLifecycleId:
          type: integer
          minimum: 1
        credentialKind:
          $ref: '#/components/schemas/CredentialKind'
        expiresOn:
          type: string
          format: date
        thresholdDays:
          type: integer
          enum:
          - 30
          - 7
        alertedAt:
          type: string
          format: date-time
    CredentialAlertPage:
      type: object
      required:
      - content
      - page
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CredentialAlert'
        page:
          $ref: '#/components/schemas/PageMeta'
    RegisteredIp:
      type: object
      description: 허용 IP 기록(registered_ip)
      required:
      - id
      - service
      - ipAddress
      - note
      - createdAt
      properties:
        id:
          type: integer
          minimum: 1
        service:
          type: string
          enum:
          - COMMERCE_API
          - RAKUTEN
        ipAddress:
          type: string
          maxLength: 45
          description: IP 주소(inet). 커머스API는 IPv4
        note:
          type:
          - string
          - 'null'
          maxLength: 200
        createdAt:
          type: string
          format: date-time
    RegisteredIpList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RegisteredIp'
    RegisteredIpCreateRequest:
      type: object
      required:
      - service
      - ipAddress
      properties:
        service:
          type: string
          enum:
          - COMMERCE_API
          - RAKUTEN
        ipAddress:
          type: string
          maxLength: 45
          description: service=COMMERCE_API면 IPv4만
        note:
          type:
          - string
          - 'null'
          maxLength: 200
    NoticeMonitorCheck:
      type: object
      description: 공지 모니터링 대상의 최신 확인 1회(notice_monitor_check)
      required:
      - id
      - target
      - checkedAt
      - succeeded
      - contentSha256
      - latestMarker
      - changed
      - changeSummary
      properties:
        id:
          type: integer
          minimum: 1
        target:
          type: string
          description: COMMERCE_API_NOTICE=커머스API 공지, COMMERCE_API_LLMS_TXT=llms.txt 문서 버전, RAKUTEN_RWS_BLOG=라쿠텐 RWS 블로그
          enum:
          - COMMERCE_API_NOTICE
          - COMMERCE_API_LLMS_TXT
          - RAKUTEN_RWS_BLOG
        checkedAt:
          type: string
          format: date-time
        succeeded:
          type: boolean
        contentSha256:
          type:
          - string
          - 'null'
          pattern: ^[0-9a-f]{64}$
        latestMarker:
          type:
          - string
          - 'null'
          description: 최신 표지(공지 id·문서 버전·글 날짜 등)
        changed:
          type: boolean
          description: 직전 확인과 달라졌는지
        changeSummary:
          type:
          - string
          - 'null'
    NoticeMonitorCheckList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NoticeMonitorCheck'
    ScreenEventRequest:
      type: object
      description: 화면 체류 이벤트(user_action_log M2 값). 게이트 통과(GATE_PASSED)는 게이트 API가 남기므로 여기서 받지 않는다
      required:
      - eventType
      - viewKey
      properties:
        eventType:
          type: string
          enum:
          - GATE_ENTERED
          - SCREEN_ENTERED
          - SCREEN_LEFT
          - WINDOW_INACTIVE
          - WINDOW_ACTIVE
        viewKey:
          type: string
          format: uuid
          maxLength: 36
          description: 화면 진입·이탈 짝 맞춤 키(view_key). 같은 viewKey+eventType 재전송은 무시
        screenId:
          type:
          - string
          - 'null'
          pattern: ^SCR-(0[1-9]|1[0-2])$
          description: SCREEN_ENTERED·SCREEN_LEFT면 필수
        candidateId:
          type:
          - integer
          - 'null'
          minimum: 1
          description: 단계 화면·게이트 이벤트의 후보 id. SCR-02(키워드)면 반드시 null
        gate:
          type:
          - string
          - 'null'
          enum:
          - G1
          - G2
          - G3
          - G4
          - G5
          - null
          description: GATE_ENTERED면 필수
        stepCode:
          description: 단계 화면이면 그 단계
          oneOf:
          - $ref: '#/components/schemas/StepCode'
          - type: 'null'
tags:
- name: step-engine
  description: 후보·단계 실행·게이트(05-1 §2.1). 후보 한 건을 중심으로 ②~⑧ 단계 실행, 오너 수정, 연속·일괄 실행, G2·G3 통과, 후보 상태 전이를 맡는다.
- name: common
  description: SSE 진행 알림 스트림과 이미지 파일(05-1 §2.15).
- name: keywords
  description: ① 키워드 — 데이터랩 버튼 수집·붙여넣기 묶음, G1 키워드 고르기, 아동 단어, (M2) 브랜드 사전·검색어 제안·하위 cid
- name: sourcing
  description: ② 라쿠텐 소싱 — 검색어 검사, URL 상품 읽기, 비교표·앵커·행 수정·재고 확인·수동 행·성인용 확인·최종 선택
- name: pricing
  description: ③ 가격·마진 판정 — 국내 기준가, 네이버쇼핑 링크, 판정 결과, 환율, (M2) 시뮬레이션·재계산·셀라파인더 가져오기
- name: category
  description: ④ 카테고리 — 리프 후보·예외 판단 조회와 리프 고르기(KC 면제 성인용 확인)
- name: thumbnails
  description: ⑤ 썸네일 — 라쿠텐 원본 이미지, 레퍼런스 선택, AI 후보 생성, G3 선택 산출물(C4 thumbnails 모듈)
- name: content
  description: ⑥ 상세 콘텐츠·고시 — ⑥-1 카피, ⑥-2 고시 원자료, ⑥-3 고시·사양·고지·HTML(C4 content 모듈)
- name: tags
  description: ⑦ 태그 — 태그 후보표·최종 태그·뺀 태그, 경쟁 태그 입력(C4 tags 모듈)
- name: registration
  description: ⑧ 업로드 · ⑨ 등록 — 업로드 산출물, G4 승인 미리보기·사전 검증·최종 승인, 등록 기록, 등록 API 차단 스위치(C4 registration 모듈)
- name: products
  description: 등록 상품·판매상품비중(M2). 등록 뒤 전시·판매 상태·재고·가격 관리와 하루 1회 동기화 결과를 다룬다(ERD §6.1 smartstore_product, smartstore_product_sync, sales_ratio_record).
- name: dashboard
  description: 대시보드 읽기 전용 집계(M2). 여러 모듈의 테이블을 읽기만 한다. C4에 없는 읽기 전용 dashboard 모듈을 새로 둔다(§7.5-45 제안 반영). M1 대시보드는 step-engine의 GET /candidate-steps, GET /candidates/resume-target만 쓴다.
- name: settings
  description: 설정(JSON 파일이 원본, DB는 settings_snapshot 사본)·구매대행 프로필·배대지 요금표(ERD §3.11).
- name: integrations
  description: 커머스API 메타데이터 캐시와 동기화, 외부 호출 기록(call_log) 집계, AI 사용량(ERD §3.12). AI 엔진 어댑터(AiEngineAdapter)는 이 모듈에 있지만 점검 기록 API는 system이다(D-16).
- name: system
  description: 비밀정보(macOS 키체인)·커머스API 인증·AI 엔진 감지·연결 테스트(ai_cli_check, D-16)·사전조건·설치본·자격증명 수명·허용 IP·공지 모니터링·화면 체류 기록. 비밀값은 어떤 응답에도 담지 않는다(NFR-02).
