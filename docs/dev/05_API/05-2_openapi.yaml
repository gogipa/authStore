      - type: object
        required:
        - candidateId
        - confirmedAt
        properties:
          candidateId:
            type: integer
            minimum: 1
          confirmedAt:
            type: string
            format: date-time
            x-proposal: 확인 시각 저장 위치가 ERD에 없음(§7.6 S9)
    SmartstoreProductStatus:
      type: string
      description: 등록 상품 상태(§7.5-46 결정, ERD §7.1-1 예시). ON_SALE=판매중, DISPLAY_SUSPENDED=전시중지, SALE_SUSPENDED=판매중지, DELETED=삭제됨
      enum:
      - ON_SALE
      - DISPLAY_SUSPENDED
      - SALE_SUSPENDED
      - DELETED
    SmartstoreProductActionReason:
      type: string
      description: 조치 필요 사유(smartstore_product.action_reasons, F-PM-18). OUT_OF_STOCK=품절, NEGATIVE_MARGIN=역마진, OVER_150_USD=150달러 초과(과세 전환)
      enum:
      - OUT_OF_STOCK
      - NEGATIVE_MARGIN
      - OVER_150_USD
    SmartstoreProductSummary:
      type: object
      description: 등록 상품 1건(smartstore_product 1행 + 등록 기록·최신 판정에서 읽은 표시값)
      required:
      - id
      - registrationId
      - itemCode
      - selectedColor
      - originProductNo
      - channelProductNo
      - status
      - originStatusType
      - displayStatusType
      - displaySuspendedSince
      - displaySuspendedDays
      - inspectionStatus
      - salePriceKrw
      - marginRate
      - registeredAt
      - lastSyncedAt
      - nextCheckDueAt
      - actionRequired
      - actionReasons
      - syncDelayed
      properties:
        id:
          type: integer
          minimum: 1
          description: smartstore_product.id
        registrationId:
          type: integer
          minimum: 1
          description: 이 상품을 만든 등록 기록(UNIQUE)
        itemCode:
          type: string
          maxLength: 128
        selectedColor:
          type: string
          maxLength: 128
        productName:
          type:
          - string
          - 'null'
          description: 등록 때 보낸 상품명(registration.requestJson의 originProduct.name에서 읽는다). 표시용
        originProductNo:
          type: string
          pattern: ^[0-9]+$
          maxLength: 20
          description: 원상품 번호(숫자 문자열)
        channelProductNo:
          type:
          - string
          - 'null'
          pattern: ^[0-9]+$
          maxLength: 20
          description: 채널 상품 번호(얻지 못하면 null, ERD §7.3-6)
        status:
          $ref: '#/components/schemas/SmartstoreProductStatus'
        originStatusType:
          type:
          - string
          - 'null'
          maxLength: 20
          description: 원상품 판매 상태 미러(커머스API 값 그대로, 예 SALE, SUSPENSION, UNADMISSION, REJECTION)
        displayStatusType:
          type:
          - string
          - 'null'
          maxLength: 20
          description: 채널 상품 전시 상태 미러(예 ON, SUSPENSION)
        displaySuspendedSince:
          type:
          - string
          - 'null'
          format: date-time
        displaySuspendedDays:
          type:
          - integer
          - 'null'
          minimum: 0
          description: 전시중지 경과일(계산). 7일 넘으면 경고(F-PM-04)
        inspectionStatus:
          type:
          - string
          - 'null'
          maxLength: 20
          description: 검수 상태 미러(커머스API 값 그대로)
        salePriceKrw:
          type:
          - integer
          - 'null'
          minimum: 0
          description: 최신 판정(동기화 재판정이 있으면 그것, 없으면 등록 판정)의 price_judgement.salePriceKrw
        marginRate:
          type:
          - number
          - 'null'
          description: 최신 판정의 판매 가능 사이즈 중 가장 낮은 marginRateA(비율, 예 0.1250). 판정이 없으면 null
        registeredAt:
          type:
          - string
          - 'null'
          format: date-time
          description: registration.registeredAt
        lastSyncedAt:
          type:
          - string
          - 'null'
          format: date-time
        nextCheckDueAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 순환 주기상 다음 확인 예정 시각
        actionRequired:
          type: boolean
        actionReasons:
          type: array
          items:
            $ref: '#/components/schemas/SmartstoreProductActionReason'
        syncDelayed:
          type: boolean
          description: 조회 몫·순환 주기를 넘겨 확인이 밀림(F-PM-17)
    SmartstoreProductCounts:
      type: object
      description: 등록 상품 목록 상단 집계(필터와 무관한 전체 기준)
      required:
      - totalCount
      - displaySuspendedCount
      - actionRequiredCount
      properties:
        totalCount:
          type: integer
          minimum: 0
          description: DELETED를 뺀 등록 상품 수
        displaySuspendedCount:
          type: integer
          minimum: 0
        actionRequiredCount:
          type: integer
          minimum: 0
    SmartstoreProductPage:
      type: object
      required:
      - content
      - page
      - summary
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SmartstoreProductSummary'
        page:
          $ref: '#/components/schemas/PageMeta'
        summary:
          $ref: '#/components/schemas/SmartstoreProductCounts'
    SmartstoreProductSizeStatus:
      type: object
      description: 사이즈별 재고·가격·마진(최신 판정 price_judgement_size + 마지막 동기화 결과)
      required:
      - sizeMm
      - rakutenQuantity
      - storeStockQuantity
      - sizeSalePriceKrw
      - marginRateA
      - isSellable
      properties:
        sizeMm:
          type: integer
          minimum: 1
          description: 사이즈(mm)
        rakutenQuantity:
          type:
          - integer
          - 'null'
          minimum: 0
          description: 마지막으로 읽은 라쿠텐 재고 수(rakuten_sku.quantity). 모르면 null
        storeStockQuantity:
          type:
          - integer
          - 'null'
          minimum: 0
          description: 스마트스토어 옵션 재고(마지막으로 보낸 값·동기화 결과). 모르면 null
        sizeSalePriceKrw:
          type:
          - integer
          - 'null'
          minimum: 0
          description: price_judgement_size.sizeSalePriceKrw
        marginRateA:
          type:
          - number
          - 'null'
          description: price_judgement_size.marginRateA(비율)
        isSellable:
          type: boolean
          description: price_judgement_size.isSellable
    SmartstoreProductActionSuggestion:
      type: object
      description: 조치 사유에 맞춘 제안(F-PM-19). 저장하지 않고 조회 때 계산하며 실행은 오너가 쓰기 API를 눌러야 한다
      required:
      - reason
      - suggestion
      properties:
        reason:
          $ref: '#/components/schemas/SmartstoreProductActionReason'
        suggestion:
          type: string
          description: SUSPEND_SALE=판매중지(PUT …/sale-status), UPDATE_PRICE=판매가 수정(PATCH), MARK_OPTION_OUT_OF_STOCK=옵션 품절 처리(PATCH optionStocks 0)
          enum:
          - SUSPEND_SALE
          - UPDATE_PRICE
          - MARK_OPTION_OUT_OF_STOCK
        sizeMm:
          type:
          - integer
          - 'null'
          minimum: 1
          description: 옵션 품절 처리 대상 사이즈
        suggestedSalePriceKrw:
          type:
          - integer
          - 'null'
          minimum: 0
          description: 가격 수정 제안값(재판정 판매가)
    SmartstoreProductDetail:
      description: 등록 상품 상세
      allOf:
      - $ref: '#/components/schemas/SmartstoreProductSummary'
      - type: object
        required:
        - sizes
        - suggestions
        - priceJudgementId
        properties:
          sizes:
            type: array
            items:
              $ref: '#/components/schemas/SmartstoreProductSizeStatus'
          suggestions:
            type: array
            items:
              $ref: '#/components/schemas/SmartstoreProductActionSuggestion'
          priceJudgementId:
            type:
            - integer
            - 'null'
            minimum: 1
            description: 표시값의 근거 판정 id
    SmartstoreProductDisplayRequest:
      type: object
      properties:
        resumeSale:
          type: boolean
          default: false
          description: 판매중지 상태면 판매 재개도 함께 건다(F-PM-05)
    SmartstoreProductBulkDisplayRequest:
      type: object
      required:
      - productIds
      properties:
        productIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: integer
            minimum: 1
        resumeSale:
          type: boolean
          default: false
    SmartstoreProductBulkDisplayAccepted:
      type: object
      required:
      - jobId
      - status
      - productIds
      - acceptedAt
      properties:
        jobId:
          type: integer
          minimum: 1
          description: 일괄 전시 작업 id
          x-proposal: S7 — 일괄 전시 작업 id를 저장할 곳이 ERD에 없어 범용 비동기 작업(job) 행이 필요하다
        status:
          type: string
          enum:
          - RUNNING
        productIds:
          type: array
          items:
            type: integer
            minimum: 1
        acceptedAt:
          type: string
          format: date-time
    SmartstoreProductSaleStatusRequest:
      type: object
      required:
      - saleStatus
      properties:
        saleStatus:
          type: string
          description: SALE=판매 재개, SUSPENSION=판매중지(커머스API change-status 값)
          enum:
          - SALE
          - SUSPENSION
    SmartstoreProductUpdateRequest:
      type: object
      description: 바꾼 값만 보낸다(최소 한 필드)
      minProperties: 1
      properties:
        salePriceKrw:
          type: integer
          exclusiveMinimum: 0
          description: 새 판매가(원, multi-update)
        optionStocks:
          type: array
          minItems: 1
          description: 사이즈별 재고(option-stock). 품절 처리는 stockQuantity 0
          items:
            type: object
            required:
            - sizeMm
            - stockQuantity
            properties:
              sizeMm:
                type: integer
                minimum: 1
              stockQuantity:
                type: integer
                minimum: 0
    SmartstoreProductActionResult:
      type: object
      description: 등록 상품 쓰기 결과(SSE smartstore-product.changed와 같은 뜻)
      required:
      - productId
      - action
      - changed
      - status
      - originStatusType
      - displayStatusType
      properties:
        productId:
          type: integer
          minimum: 1
        action:
          type: string
          description: DISPLAY_ON=전시 켜기, SALE_STATUS=판매 상태 변경, UPDATE=재고·가격 수정
          enum:
          - DISPLAY_ON
          - SALE_STATUS
          - UPDATE
        changed:
          type: boolean
          description: false면 이미 목표 상태라 외부 수정을 보내지 않았다
        status:
          $ref: '#/components/schemas/SmartstoreProductStatus'
        originStatusType:
          type:
          - string
          - 'null'
          maxLength: 20
        displayStatusType:
          type:
          - string
          - 'null'
          maxLength: 20
    SmartstoreProductSyncRequest:
      type: object
      properties:
        productIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: 없으면 DELETED가 아닌 등록 상품 전체
          items:
            type: integer
            minimum: 1
    SmartstoreProductSyncAccepted:
      type: object
      required:
      - jobId
      - status
      - targetProductCount
      - acceptedAt
      properties:
        jobId:
          type: integer
          minimum: 1
          description: 이번 동기화 작업 id(상품별 결과는 smartstore_product_sync 행)
          x-proposal: S7 — 동기화 한 번을 묶는 작업 행이 ERD에 없어(sync는 상품별 행뿐) 범용 비동기 작업(job) 행이 필요하다
        status:
          type: string
          enum:
          - RUNNING
        targetProductCount:
          type: integer
          minimum: 0
        acceptedAt:
          type: string
          format: date-time
    SmartstoreProductSync:
      type: object
      description: 등록 상품 동기화 1회 결과(smartstore_product_sync, 추가만)
      required:
      - id
      - smartstoreProductId
      - checkedAt
      - method
      - succeeded
      - changeDetected
      - priceJudgementId
      - actionReasons
      - result
      - errorMessage
      properties:
        id:
          type: integer
          minimum: 1
        smartstoreProductId:
          type: integer
          minimum: 1
        checkedAt:
          type: string
          format: date-time
        method:
          type: string
          description: ITEM_SEARCH_API=라쿠텐 API 1차 변동 감지, PAGE=상품 페이지 조회
          enum:
          - ITEM_SEARCH_API
          - PAGE
        succeeded:
          type: boolean
        changeDetected:
          type: boolean
        priceJudgementId:
          type:
          - integer
          - 'null'
          minimum: 1
          description: 재판정 스냅샷(저장 위치 ERD §7.4-2)
        actionReasons:
          type: array
          items:
            $ref: '#/components/schemas/SmartstoreProductActionReason'
        result:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: 확인 결과 원문(사이즈별 가격·재고 등, jsonb)
        errorMessage:
          type:
          - string
          - 'null'
    SmartstoreProductSyncPage:
      type: object
      required:
      - content
      - page
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SmartstoreProductSync'
        page:
          $ref: '#/components/schemas/PageMeta'
    SalesRatioLevel:
      type: string
      description: 판매상품비중 경고 단계(계산값, F-DB-08). NORMAL=5% 이상, BELOW_5_PERCENT=5% 미만(정리 후보 안내), BELOW_3_PERCENT=3% 미만(자동 정리 위험)
      enum:
      - NORMAL
      - BELOW_5_PERCENT
      - BELOW_3_PERCENT
    SalesRatioRecord:
      type: object
      description: 판매상품비중 입력 기록(sales_ratio_record). 원본 CSV 경로(csv_file_path)는 로컬 경로라 주지 않는다
      required:
      - id
      - measuredOn
      - ratio
      - source
      - csvSha256
      - enteredAt
      - level
      properties:
        id:
          type: integer
          minimum: 1
        measuredOn:
          type: string
          format: date
          description: 측정 기준일(KST)
        ratio:
          type: number
          minimum: 0
          maximum: 100
          description: 판매상품비중(퍼센트, 5.0 = 5%)
        source:
          type: string
          enum:
          - MANUAL
          - CSV
        csvSha256:
          type:
          - string
          - 'null'
          pattern: ^[0-9a-f]{64}$
        enteredAt:
          type: string
          format: date-time
        level:
          $ref: '#/components/schemas/SalesRatioLevel'
    SalesRatioRecordCreateRequest:
      type: object
      required:
      - ratio
      properties:
        ratio:
          type: number
          minimum: 0
          maximum: 100
          description: 퍼센트 값(5.0 = 5%)
        measuredOn:
          type: string
          format: date
          description: 없으면 KST 오늘
    SalesRatioCsvImportRequest:
      type: object
      required:
      - file
      properties:
        file:
          type: string
          contentMediaType: text/csv
          description: 스마트스토어센터에서 받은 CSV(5MB 이하)
    SalesRatioRecordPage:
      type: object
      required:
      - content
      - page
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SalesRatioRecord'
        page:
          $ref: '#/components/schemas/PageMeta'
    DashboardStepWaitingCount:
      type: object
      description: 단계·상태별 대기 후보 수(candidate_step 집계, EXCLUDED·REGISTERED 후보 제외)
      required:
      - stepCode
      - status
      - count
      properties:
        stepCode:
          $ref: '#/components/schemas/StepCode'
        status:
          $ref: '#/components/schemas/StepStatus'
        count:
          type: integer
          minimum: 0
    DashboardGateWaitingCount:
      type: object
      description: 게이트별 대기 후보 수. G2=소싱 확정 대기, G3=썸네일 확정 대기, G4=최종 승인 대기(AWAITING_APPROVAL)
      required:
      - gate
      - count
      properties:
        gate:
          type: string
          enum:
          - G2
          - G3
          - G4
        count:
          type: integer
          minimum: 0
    DashboardRegistrationLimit:
      type: object
      description: 등록 한도 현황(F-DB-05)
      required:
      - registeredProductCount
      - limit
      - usageRate
      - warning
      properties:
        registeredProductCount:
          type: integer
          minimum: 0
          description: DELETED가 아닌 smartstore_product 수(전시중지 포함)
        limit:
          type: integer
          minimum: 1
          description: 설정의 등록 한도(기본 1,000, F-ST-24)
        usageRate:
          type: number
          minimum: 0
          description: registeredProductCount / limit(비율, 0.8 = 80%)
        warning:
          type: boolean
          description: usageRate가 0.8 이상
    DashboardSummary:
      type: object
      required:
      - date
      - processedCount
      - stepWaiting
      - gateWaiting
      - registrationLimit
      properties:
        date:
          type: string
          format: date
          description: 집계 기준일(KST)
        processedCount:
          type: integer
          minimum: 0
          description: 그날 승인대기에 처음 닿은 후보 수(후보당 1회, F-DB-04)
        stepWaiting:
          type: array
          items:
            $ref: '#/components/schemas/DashboardStepWaitingCount'
        gateWaiting:
          type: array
          items:
            $ref: '#/components/schemas/DashboardGateWaitingCount'
        registrationLimit:
          $ref: '#/components/schemas/DashboardRegistrationLimit'
    DashboardCleanupCandidate:
      type: object
      description: 미판매 상품 정리 후보 1건
      required:
      - productId
      - itemCode
      - selectedColor
      - productName
      - originProductNo
      - registeredAt
      - displayStatusType
      - lastSoldOn
      properties:
        productId:
          type: integer
          minimum: 1
        itemCode:
          type: string
          maxLength: 128
        selectedColor:
          type: string
          maxLength: 128
        productName:
          type:
          - string
          - 'null'
        originProductNo:
          type: string
          pattern: ^[0-9]+$
          maxLength: 20
        registeredAt:
          type:
          - string
          - 'null'
          format: date-time
        displayStatusType:
          type:
          - string
          - 'null'
          maxLength: 20
        lastSoldOn:
          type:
          - string
          - 'null'
          format: date
          description: 마지막으로 팔린 날. 출처가 정해지기 전에는 늘 null
          x-proposal: S11 — 상품별 판매 여부 출처가 없다(주문 API 미사용). smartstore_product.last_sold_on 수동 입력 또는 CSV 상품별 행이 필요하다
    DashboardCleanupCandidatePage:
      type: object
      required:
      - content
      - page
      - salesRatioLevel
      - latestSalesRatio
      - measuredOn
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/DashboardCleanupCandidate'
        page:
          $ref: '#/components/schemas/PageMeta'
        salesRatioLevel:
          description: 최신 판매상품비중의 경고 단계. 입력이 없으면 null
          oneOf:
          - $ref: '#/components/schemas/SalesRatioLevel'
          - type: 'null'
        latestSalesRatio:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
          description: 최신 비중(퍼센트)
        measuredOn:
          type:
          - string
          - 'null'
          format: date
    DashboardSystemWarning:
      type: object
      description: 대시보드 시스템 경고 1건
      required:
      - kind
      - message
      - occurredAt
      properties:
        kind:
          type: string
          description: NOTICE_MONITOR_CHANGED=외부 변경 감지(notice_monitor_check), CREDENTIAL_EXPIRING=자격증명 만료 임박·만료(credential_alert), SETTINGS_INVALID=설정 파일 검사 오류
          enum:
          - NOTICE_MONITOR_CHANGED
          - CREDENTIAL_EXPIRING
          - SETTINGS_INVALID
        message:
          type: string
          description: 화면에 그대로 보여 줄 한국어 문구(비밀 없음)
        occurredAt:
          type: string
          format: date-time
          description: 확인·경고·검사 시각
        noticeMonitorCheckId:
          type:
          - integer
          - 'null'
          minimum: 1
        noticeMonitorTarget:
          type:
          - string
          - 'null'
          enum:
          - COMMERCE_API_NOTICE
          - COMMERCE_API_LLMS_TXT
          - RAKUTEN_RWS_BLOG
          - null
        changeSummary:
          type:
          - string
