        snapshot:
          $ref: '#/components/schemas/SettingsSnapshot'
        created:
          type: boolean
          description: true면 새 스냅샷, false면 같은 내용의 기존 스냅샷
        changedKeys:
          type: array
          description: 직전 현재 스냅샷과 달라진 설정 키(점 경로)
          items:
            type: string
        rerunRequiredStepCount:
