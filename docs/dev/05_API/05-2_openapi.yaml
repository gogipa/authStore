    TagCandidateItem:
      type: object
      description: ⑦ 버전의 태그 후보 한 행(tag_candidate)
      required:
      - id
      - text
      - textKey
      - inRecommend
      - inCompetitor
      - ownerAdded
      - outcome
      - dictionaryUnregistered
      properties:
        id:
          type: integer
          minimum: 1
        text:
          type: string
          maxLength: 100
          description: 보낼 태그 텍스트
        textKey:
          type: string
          maxLength: 100
          description: 정규화 키(중복 제거 기준)
        code:
          type:
          - string
          - 'null'
          pattern: ^[0-9]+$
          maxLength: 20
          description: recommend-tags 태그 ID(숫자 문자열). 추천과 정확히 일치할 때만
        inRecommend:
          type: boolean
        inCompetitor:
          type: boolean
        ownerAdded:
          type: boolean
        competitorBestRank:
          type:
          - integer
          - 'null'
          minimum: 1
        competitorFrequency:
          type:
          - integer
          - 'null'
          minimum: 1
        inputOrder:
          type:
          - integer
          - 'null'
          description: 경쟁 태그 입력 순서(빈도가 없을 때 선정 기준)
        outcome:
          type: string
          enum:
          - SELECTED
          - NOT_SELECTED
          - FILTERED
          - RESTRICTED
          - OWNER_REMOVED
          - BELOW_SCORE
          description: SELECTED=최종 태그, NOT_SELECTED=10개 초과, FILTERED=규칙 필터, RESTRICTED=제한 태그, OWNER_REMOVED=오너 삭제, BELOW_SCORE=기준 점수 미만(M2)
        filterReason:
          type:
          - string
          - 'null'
          enum:
          - CATEGORY_TOKEN
          - BRAND_NAME
          - STORE_NAME
          - PROMOTION
          - ATTRIBUTE_MISMATCH
          - null
        filterDetail:
          type:
          - string
          - 'null'
          maxLength: 200
          description: 걸린 사전 항목이나 설명('뺀 태그와 사유')
        restricted:
          type:
          - boolean
          - 'null'
          description: restricted-tags 1차 결과. null = 조회 안 함
        finalOrder:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10
          description: 최종 태그 순서(SELECTED만)
        dictionaryUnregistered:
          type: boolean
          description: 오너 추가이고 code가 없어 '사전 미등록' 경고(계산)
        score:
          type:
          - number
          - 'null'
          description: (M2) 0.6×경쟁 빈도비 + 0.4×사전 등재. M1은 null
    FinalTagItem:
      type: object
