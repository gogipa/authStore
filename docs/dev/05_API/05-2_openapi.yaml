# 05-2. OpenAPI 3.1 명세 — 신발 자동등록 로컬 API (원본, API-first)
# 버전 0.2 · 2026-09-27 · 근거: 05-1_엔드포인트표.md, 04-1_ERD.md(v0.4), 04-3_schema.prisma · D-16(AI 엔진 선택: GET·PUT /settings/ai-engine 신설, /ai-cli-checks M1 승격, StepRun aiEngine·aiModel·aiCliVersion) 반영
# 확장 키: x-milestone(M1/M2), x-features(기능 ID), x-decision(명세 작성 중 정한 것, D-16 반영분은 'D-16'으로 시작하거나 포함), x-proposal(M2 전에 정할 스키마 추가 제안)
# 검사: Redocly CLI 2.54 lint 통과(오류 0, 경고 0). 구현(@nestjs/swagger)이 내보내는 명세는 이 파일과 대조한다.
openapi: 3.1.0
info:
  title: 신발 자동등록 로컬 API
  version: 0.2.0
  description: '라쿠텐 신발을 네이버 스마트스토어에 해외구매대행으로 올리는 1인 로컬 웹앱의 API다.

    이 PC(127.0.0.1)에서만 열리고 로그인이 없다(GEN-01). 상태를 바꾸는 요청은 X-AutoStore-Client 헤더와 같은 출처(Origin)가 필요하다.

    비밀정보는 어떤 응답에도 담기지 않는다(NFR-02). 원본 명세다(API-first) — 구현이 내보내는 명세는 이 파일과 대조한다.

    '
  license:
    name: 비공개(지인·동료 무료 배포, D-09)
    identifier: LicenseRef-Private
servers:
- url: http://127.0.0.1:{port}/api/v1
  description: 로컬 BE
  variables:
    port:
      default: '3100'
security: []
paths:
  /candidates:
    get:
      operationId: listCandidates
      summary: 진행 중 후보 목록
      description: 후보 목록(페이징). 후보별 단계 상태 요약과 이어 할 단계(resumeStepCode)를 준다. status를 주지 않으면 EXCLUDED·REGISTERED를 뺀다. runnableStep을 주면 그 단계를 지금 실행할 수 있는 후보만 준다(입력 고르기 패널). URL 후보 배지는 creationPath로 FE가 그린다. sort 허용 필드는 statusChangedAt·createdAt·id, 기본은 statusChangedAt,desc. 허용하지 않은 필터·정렬 값은 422 INVALID_QUERY_PARAMETER.
      tags:
      - step-engine
      x-milestone: M1
      x-features:
      - F-CW-09
      - F-CW-10
      - F-CW-12
      - F-CW-22
      - F-DB-01
      parameters:
      - name: status
        in: query
        description: 후보 상태. 여러 번 줄 수 있다
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/CandidateStatus'
      - name: runnableStep
        in: query
        description: 이 단계를 지금 실행할 수 있는 후보만
        schema:
          $ref: '#/components/schemas/StepCode'
      - name: q
        in: query
        description: 型番·itemCode·검색어 부분 일치
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: 후보 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidatePage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createCandidate
      summary: 후보 만들기
      description: creationPath 4종(표 D)으로 후보를 만든다. candidate + candidate_step 10행(NOT_RUN) + 상태 이력(CREATED)을 한 트랜잭션으로 쓴다. RAKUTEN_URL은 ② URL_CREATE 버전(비교 안 함, 앵커 = URL 상품)까지 같은 트랜잭션. 오류 — 404 RAKUTEN_ITEM_NOT_FOUND·KEYWORD_NOT_FOUND, 409 KEYWORD_NOT_SELECTED·KEYWORD_EXCLUDED·CANDIDATE_DUPLICATE(details.existingCandidateId), 422 RAKUTEN_QUERY_INVALID·RAKUTEN_ITEM_EXCLUDED_WORD·VALIDATION_FAILED. 키워드·검색어 경로는 만들 때 itemCode가 없어 중복 검사는 ② 소싱 선택 때 걸린다. M1에서는 DIRECT_INPUT(M2 임시 후보)을 만들지 않고 422 VALIDATION_FAILED(fieldErrors creationPath)로 답한다(P1-04 Proposed — 연결 API가 M2라 임시 후보가 남기만 한다).
      tags:
      - step-engine
      x-milestone: M1
      x-features:
      - F-KW-08
      - F-SO-01
      - F-SO-31
      - F-SO-35
      - F-CW-04
      - F-CW-25
      x-decision: §7.3-23 제안대로 라쿠텐 URL 상품이 아동화 의심·대상 외 장르여도 막지 않고 후보를 만든 뒤 ②를 WAITING_INPUT(성인용 확인)으로 둔다.
      parameters:
      - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateCreateRequest'
      responses:
        '201':
          description: 후보를 만들었다. DIRECT_INPUT(M2)은 TEMP, 그 밖은 WORKING
          headers:
            Location:
              description: 만든 후보 경로(/api/v1/candidates/{candidateId})
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /candidates/status-counts:
    get:
      operationId: getCandidateStatusCounts
      summary: 상태별 후보 수
      description: 목록 탭 배지용 상태별 후보 수(candidate GROUP BY status). 페이징 없음.
      tags:
      - step-engine
      x-milestone: M1
      x-features:
      - F-CW-09
      responses:
        '200':
          description: 상태별 후보 수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateStatusCountList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /candidates/resume-target:
    get:
      operationId: getCandidateResumeTarget
      summary: 이어서 할 곳 한 건
      description: 대시보드 '이어서 할 곳' 한 건(후보·단계 또는 게이트). ix_candidate_step_attention과 게이트 대기 계산으로 찾는다. 이어 할 곳이 없으면 204.
      tags:
      - step-engine
      x-milestone: M1
      x-features:
      - F-CW-10
      x-decision: §7.2-11 여러 후보 중에서는 목록 기본 정렬(statusChangedAt desc)의 첫 진행 중 후보를 고르고, 그 후보 안에서는 흐름상 첫 입력대기·미실행·실패·재실행 필요 단계 또는 대기 중인 게이트를 준다(F-CW-10). 게이트 우선 규칙은 두지 않는다.
      responses:
        '200':
          description: 이어서 할 곳
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateResumeTarget'
        '204':
          description: 이어서 할 곳이 없다
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /candidates/{candidateId}:
    parameters:
    - $ref: '#/components/parameters/CandidateId'
    get:
      operationId: getCandidate
      summary: 후보 상세
      description: 앵커 키·소싱 선택·성별·출처 키워드·게이트 유효성·잠금·페이지 데이터 오래됨·열린 연속 실행. 잠금은 status로 계산한다(F-CW-07). 오래됨 = 현재 ② 버전 rakuten_item.collected_at + 설정 6시간이며 '재실행 필요'로 바꾸지 않는다(F-CW-20). G4 시각은 registration.approved_at을 읽기만 한다.
      tags:
      - step-engine
      x-milestone: M1
      x-features:
      - F-CW-03
      - F-CW-07
      - F-CW-08
      - F-CW-10
      - F-CW-11
      - F-CW-12
      - F-CW-20
      responses:
        '200':
          description: 후보 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /candidates/{candidateId}/steps:
    parameters:
    - $ref: '#/components/parameters/CandidateId'
    get:
      operationId: listCandidateSteps
      summary: 단계 레일
      description: '단계 10개(페이징 없음): 상태·현재 버전·입력 출처·재실행 사유, 실행·연속 실행·수정 버튼의 켜짐과 꺼진 이유, G2 전 AI 비용 경고(PRE_G2_AI_COST). 꺼진 이유(disabledReason.code)는 실행 API의 409 코드와 같은 계산을 한 곳에서 한다. P1-05 — run은 startCandidateStepRun과 같은 검사(INVALID_STEP_CODE·CANDIDATE_LOCKED·CANDIDATE_EXCLUDED·SETTINGS_INVALID·STEP_ALREADY_RUNNING·STEP_LOCKED_BY_RUNNING_STEP·STEP_START_CONDITION_UNMET·GATE_NOT_PASSED), edit은 오너 수정 EDIT와 같은 검사, continuousRun은 run 검사 + G2 전 ②·③ 밖이면 CONTINUOUS_RUN_BEFORE_G2(연속 실행 API는 P1-06).'
      tags:
      - step-engine
      x-milestone: M1
      x-features:
      - F-CW-11
      - F-CW-13
      - F-CW-14
      - F-CW-15
      - F-CW-17
      - F-CW-18
      - F-CW-20
      - F-CW-21
      responses:
        '200':
          description: 단계 레일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateStepRail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /candidates/{candidateId}/steps/{stepCode}/runs:
    parameters:
    - $ref: '#/components/parameters/CandidateId'
    - $ref: '#/components/parameters/StepCodePath'
    post:
      operationId: startCandidateStepRun
      summary: 단계 하나 실행·다시 실행
      description: 단계 하나를 실행한다(execution_mode=STEP). 입력이 같아도 새 버전을 만든다(F-BS-19). 다음 단계를 자동으로 시작하지 않는다(⑥ 묶음만 예외). REGISTER는 422 INVALID_STEP_CODE — G4는 POST /candidates/{candidateId}/registrations. 진행은 SSE step-run.status-changed. 공통 오류 — 404 CANDIDATE_NOT_FOUND, 422 INVALID_STEP_CODE·VALIDATION_FAILED, 409 STEP_START_CONDITION_UNMET(fieldErrors에 빠진 입력 키)·STEP_ALREADY_RUNNING·STEP_LOCKED_BY_RUNNING_STEP·CANDIDATE_LOCKED·CANDIDATE_EXCLUDED. 단계별 — SOURCING 422 RAKUTEN_QUERY_INVALID, 409 SECRET_NOT_CONFIGURED·DAILY_LIMIT_REACHED·EXTERNAL_CALL_COOLDOWN(Retry-After); PRICING 409 FX_RATE_UNAVAILABLE, 422 COUPON_NOT_ALLOWED; CATEGORY 409 COMMERCE_META_NOT_SYNCED; NOTICE_HTML 409 PROFILE_INCOMPLETE(details.missingFields); UPLOAD 409 GATE_NOT_PASSED(G3)·SECRET_NOT_CONFIGURED·(M2) TEMP_CANDIDATE_NOT_ALLOWED. 경고 — THUMBNAIL·COPY·NOTICE_RAW PRE_G2_AI_COST, TAGS CATEGORY_UNDECIDED. AI 엔진(D-16) — AI 엔진을 쓰는 단계는 시작 때 설정의 선택 엔진·모델과 CLI 버전을 실행 기록(aiEngine·aiModel·aiCliVersion)에 고정한다. 선택 엔진의 최신 점검(ai_cli_check)이
        미설치·로그인 풀림·계약 테스트 실패·지원 밖 버전이면 409 AI_ENGINE_UNAVAILABLE(details.engineCode·reason·settingsPath)로 거절하고 다른 엔진으로 넘어가지 않는다. 실행 중 엔진 실패는 HTTP 오류가 아니라 StepRun FAILED(errorCode=AI_ENGINE_UNAVAILABLE)와 SSE step-run.status-changed로 알린다. P1-05 구현 결정(Proposed, 05-1 §7.2) — 입력 대기 중인 단계에 새 실행 요청은 새 실행을 열지 않고 409 STEP_ALREADY_RUNNING(details.status=WAITING_INPUT), 실행기가 아직 없는 단계는 422 INVALID_STEP_CODE(details.reason=NO_RUNNER), 로드된 설정이 없으면 503 SETTINGS_INVALID. ⑥ 묶음은 시작 조건·잠금에 걸리는 뒤 단계를 건너뛰고(예 ⑥-1 실패 → ⑥-2는 실행, ⑥-3은 시작 안 함) 묶음을 끝낸다.
      tags:
      - step-engine
      x-milestone: M1
      x-features:
      - F-CW-07
      - F-CW-12
      - F-CW-13
      - F-CW-17
      - F-CW-18
      - F-BS-19
      - F-BS-75
      - F-BS-76
      - F-SO-01
      - F-SO-04
      - F-SO-09
      - F-SO-11
      - F-SO-12
      - F-SO-18
      - F-SO-36
      - F-PJ-01
      - F-PJ-14
      - F-PJ-18
      - F-PJ-21
      - F-PJ-22
      - F-PJ-24
      - F-CA-01
      - F-CA-02
      - F-CA-04
      - F-CA-07
      - F-CA-09
      - F-TH-01
      - F-TH-07
      - F-CT-05
      - F-CT-10
      - F-CT-14
      - F-CT-02
      - F-CT-03
      - F-CT-24
      - F-CT-29
      - F-CT-32
      - F-TG-01
      - F-TG-09
      - F-TG-10
      - F-TG-15
      - F-AP-01
      x-decision: §7.2-8 ⑥ '실행'(⑥-1→⑥-2→⑥-3)은 stepCode=COPY + throughStepCode=NOTICE_HTML로 둔다. 가상 단계 코드(CONTENT)나 연속 실행 끝 단계(toStep)는 만들지 않는다. D-16(오너 결정, 세부는 추천안 D-11) — 선택 엔진을 쓸 수 없으면 시작을 409 AI_ENGINE_UNAVAILABLE로 막고(R10, 자동 대체 없음), 엔진·모델·CLI 버전은 시작 때 고정해 기록한다(R9·R11).
      parameters:
      - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepRunStartRequest'
      responses:
        '202':
          description: 실행을 받았다. ⑥ 묶음이면 첫 실행만 곧바로 만들고 나머지는 SSE로 알린다
          headers:
            Location:
              description: 진행 조회 경로(/api/v1/step-runs/{stepRunId})
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepRunAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
          description: STEP_START_CONDITION_UNMET·STEP_ALREADY_RUNNING·STEP_LOCKED_BY_RUNNING_STEP·CANDIDATE_LOCKED·CANDIDATE_EXCLUDED·단계별 코드 · AI_ENGINE_UNAVAILABLE(D-16, details.engineCode·reason=NOT_INSTALLED·NOT_LOGGED_IN·CONTRACT_FAILED·VERSION_UNSUPPORTED·settingsPath=/settings/ai-engine)
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: SETTINGS_INVALID — 로드된 설정 스냅샷이 없어 실행 기록(settings_snapshot_id)을 만들 수 없음(P1-05)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: listCandidateStepRuns
      summary: 단계별 버전 이력
      description: 한 단계의 실행 버전 이력(페이징). UNIQUE(candidate_id, step_code, version). isCurrent는 candidate_step.current_step_run_id와 비교한 값. 버전별 산출물 값은 산출물 조회 API에 ?stepRunId=로 읽는다. sort 허용 필드는 version, 기본 version,desc.
      tags:
      - step-engine
      x-milestone: M1
      x-features:
      - F-CW-01
      - F-CW-19
      - F-CW-21
      x-decision: D-16(오너 결정, 세부는 추천안 D-11) — 버전마다 실행 시작 때 고정한 aiEngine·aiModel·aiCliVersion을 준다(R11, AI를 안 쓴 단계는 null)
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: 버전 이력
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepRunVersionPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /step-runs/{stepRunId}:
    parameters:
    - name: stepRunId
      in: path
      required: true
      description: 단계 실행(step_run) id
      schema:
        type: integer
        minimum: 1
    get:
      operationId: getStepRun
      summary: 단계 실행 한 건
      description: 실행 한 건의 상태·오류·입력 출처·대기 시간(step_run + step_run_input). SSE를 놓쳤을 때 확인하는 경로다. errorMessage에 비밀정보를 넣지 않는다. 없으면 404 STEP_RUN_NOT_FOUND.
      tags:
      - step-engine
      x-milestone: M1
      x-features:
      - F-CW-11
      - F-CW-13
      - F-CW-16
      - F-CW-19
      - F-BS-75
      x-decision: D-16(오너 결정, 세부는 추천안 D-11) — 실행 시작 때 고정한 aiEngine·aiModel·aiCliVersion을 준다(R11). 카피·고시 원자료의 AI 엔진 표시는 이 값을 쓴다
      responses:
        '200':
          description: 단계 실행
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepRunDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /candidates/{candidateId}/steps/{stepCode}/stale-diff:
    parameters:
    - $ref: '#/components/parameters/CandidateId'
    - $ref: '#/components/parameters/StepCodePath'
    get:
      operationId: getCandidateStepStaleDiff
