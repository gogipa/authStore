    DashboardSystemWarningList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DashboardSystemWarning'
    SettingsSnapshot:
      type: object
      description: 검증을 통과한 설정 파일 묶음의 스냅샷(settings_snapshot). 비밀 키는 설정 스키마가 허용하지 않는다
      required:
      - id
      - contentSha256
      - schemaVersion
      - appVersion
      - fileManifest
      - content
      - firstLoadedAt
      - lastLoadedAt
      - isCurrent
      properties:
        id:
          type: integer
          minimum: 1
        contentSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        schemaVersion:
          type: string
          maxLength: 20
        appVersion:
          type: string
          maxLength: 40
        fileManifest:
          description: '파일별 이름·SHA-256·크기(jsonb). 경로는 담지 않는다. P1-03(ERD §7.4-1 Proposed)은 파일 하나라 `[{ name: settings.json, sha256, sizeBytes }]`'
        content:
          type: object
          additionalProperties: true
          description: 검증을 통과한 설정 전체(요율·템플릿·사전·금지어·기준일 등)
        firstLoadedAt:
          type: string
          format: date-time
        lastLoadedAt:
          type: string
          format: date-time
        isCurrent:
          type: boolean
          description: lastLoadedAt이 가장 큰 행(현재 스냅샷)
    SettingsView:
      description: 현재 설정 스냅샷과 설정 파일 검사 결과
