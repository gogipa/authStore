      description: '고른 엔진(없으면 세 엔진)의 `--version`·실행 파일 경로·로그인 상태를 확인하고(호출 비용 없음), `smokeTest=true`면 ''OK'' 한 단어를 스키마로 받는 연결 테스트를 한 번 부른다(AI-07 계약 테스트와 같은 것).

