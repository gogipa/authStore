          description: 값을 추출·입력한 때의 itemCode
        ownerConfirmedAt:
          type:
          - string
          - 'null'
          format: date-time
        choicePending:
          type: boolean
          description: 다시 실행한 결과가 오너 입력과 달라 오너가 골라야 함
        recheckReason:
