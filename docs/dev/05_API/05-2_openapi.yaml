components:
  parameters:
    Page:
      name: page
      in: query
      description: 0부터 시작하는 페이지 번호
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: 페이지 크기(기본 20, 최대 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: 정렬. `필드,asc|desc`를 여러 번 줄 수 있다. 허용 필드는 엔드포인트마다 정해져 있다(05-3).
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: ^[a-zA-Z]+,(asc|desc)$
    ClientHeader:
      name: X-AutoStore-Client
      in: header
      required: true
      description: 상태를 바꾸는 요청에 필수. 다른 사이트가 localhost API를 부르지 못하게 한다(03-2 §5).
      schema:
        type: string
        const: '1'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 같은 요청을 다시 보내도 한 번만 처리한다(최종 승인·등록 등).
      schema:
        type: string
        format: uuid
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    StepCodePath:
      name: stepCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/StepCode'
    KeywordSnapshotIdPath:
      name: keywordSnapshotId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    KeywordIdPath:
      name: keywordId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    BrandPolicyIdPath:
      name: brandPolicyId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    RakutenItemIdPath:
      name: rakutenItemId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SourcingComparisonIdPath:
      name: sourcingComparisonId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SourcingComparisonRowIdPath:
      name: rowId
      in: path
      required: true
      description: 비교표 행 id(sourcing_comparison_row.id)
      schema:
        type: integer
        minimum: 1
    PriceJudgementIdPath:
      name: priceJudgementId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    DomesticPriceImportIdPath:
      name: importId
      in: path
      required: true
      description: 셀라파인더 가져오기 id(domestic_price_import.id)
      schema:
        type: integer
        minimum: 1
    CategoryDecisionIdPath:
      name: categoryDecisionId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    GenerationRunIdPath:
      name: generationRunId
      in: path
      required: true
      description: 썸네일 생성 시도(generation_run) id
      schema:
        type: integer
        minimum: 1
    LintWaiverIdPath:
      name: waiverId
      in: path
      required: true
      description: 린터 해제(content_lint_waiver) id
      schema:
        type: integer
        minimum: 1
    CompetitorInputIdPath:
      name: inputId
      in: path
      required: true
      description: 경쟁 태그 입력(tag_competitor_input) id
      schema:
        type: integer
        minimum: 1
    RegistrationIdPath:
      name: registrationId
      in: path
      required: true
      description: 등록 기록(registration) id
      schema:
        type: integer
        minimum: 1
    SmartstoreProductId:
      name: productId
      in: path
      required: true
      description: 등록 상품 id(smartstore_product.id)
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: 요청 형식 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 로컬 보안 검사 실패(Host·Origin·X-AutoStore-Client)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 대상 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 상태 충돌(게이트 미통과, 시작 조건 미충족, 실행 중 잠금, 하루 상한 도달 등). code로 이유를 구분한다
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: 입력 값 검증 실패(fieldErrors 포함)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: 외부 서비스(커머스API·라쿠텐·데이터랩·환율·AI CLI) 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 서버 내부 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
      - code
      - message
      - status
      - timestamp
      - path
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          description: 도메인 오류 코드(05-3)
        message:
          type: string
          description: 화면에 그대로 보여 줄 한국어 문구
        status:
          type: integer
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        details:
          type: object
          additionalProperties: true
          description: 막힌 이유의 부가 정보(예 blockedUntil, requiredGate, missingInputs)
    FieldError:
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
        message:
          type: string
        rejectedValue: {}
    PageMeta:
      type: object
      required:
      - number
      - size
      - totalElements
      - totalPages
      properties:
        number:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    StepCode:
      type: string
      description: 단계 코드(ERD §4.2). SOURCING=② 소싱, PRICING=③ 판정, CATEGORY=④ 카테고리, THUMBNAIL=⑤ 썸네일, COPY=⑥-1 카피, NOTICE_RAW=⑥-2 고시 원자료, NOTICE_HTML=⑥-3 고시·사양·고지·HTML, TAGS=⑦ 태그, UPLOAD=⑧ 업로드, REGISTER=⑨ 등록
      enum:
      - SOURCING
      - PRICING
      - CATEGORY
      - THUMBNAIL
      - COPY
      - NOTICE_RAW
      - NOTICE_HTML
      - TAGS
      - UPLOAD
      - REGISTER
    StepStatus:
      type: string
      description: 단계 상태(PRD §5.2, ERD §4.1). NOT_RUN=미실행, RUNNING=실행중, WAITING_INPUT=입력대기, COMPLETED=완료, FAILED=실패, RERUN_REQUIRED=재실행필요
      enum:
      - NOT_RUN
      - RUNNING
      - WAITING_INPUT
      - COMPLETED
      - FAILED
      - RERUN_REQUIRED
    CandidateStatus:
      type: string
      description: 후보 상태(PRD §5.2, ERD §4.1). TEMP=임시, WORKING=작업중, EXCLUDED=제외, AWAITING_APPROVAL=승인대기, VALIDATED=검증완료, REGISTERING=등록요청중, RESULT_CHECK_REQUIRED=결과확인필요, REGISTERED=등록됨
      enum:
      - TEMP
      - WORKING
      - EXCLUDED
      - AWAITING_APPROVAL
      - VALIDATED
      - REGISTERING
      - RESULT_CHECK_REQUIRED
      - REGISTERED
    CandidateCreationPath:
      type: string
      description: 생성 경로(ERD candidate.creation_path). KEYWORD=키워드, SEARCH_QUERY=검색어, RAKUTEN_URL=라쿠텐 URL, DIRECT_INPUT=직접 입력(M2)
      enum:
      - KEYWORD
      - SEARCH_QUERY
      - RAKUTEN_URL
      - DIRECT_INPUT
    CandidateGender:
      type: string
      description: 후보 성별(ERD candidate.gender). MALE=남, FEMALE=여. 공용·판단 불가는 null
      enum:
      - MALE
      - FEMALE
    CandidateGenderSource:
      type: string
      description: 성별 출처(ERD candidate.gender_source). STEP2=② 자동, OWNER=오너 입력
      enum:
      - STEP2
      - OWNER
    CandidateExcludedReason:
      type: string
      description: 제외 사유(ERD candidate.excluded_reason). ANCHOR_NO_MATCH=앵커 일치 없음, INSUFFICIENT_STOCK=재고 부족, NOT_SALE_CANDIDATE=판매 후보 아님, OWNER_EXCLUDED=오너가 제외
      enum:
      - ANCHOR_NO_MATCH
      - INSUFFICIENT_STOCK
      - NOT_SALE_CANDIDATE
      - OWNER_EXCLUDED
    CandidateStatusReason:
      type: string
      description: 후보 상태 전이 사유(ERD candidate_status_history.reason, §4.2 대응표)
      enum:
      - CREATED
      - TEMP_LINKED
      - ANCHOR_NO_MATCH
      - INSUFFICIENT_STOCK
      - NOT_SALE_CANDIDATE
      - OWNER_EXCLUDED
      - REOPENED
      - READY_FOR_APPROVAL
      - STEP_NOT_CURRENT
      - GATE_FINGERPRINT_CHANGED
      - REFETCH_G2_UNCHANGED
      - G4_APPROVED_BLOCKED
      - BLOCK_SWITCH_OFF
      - G4_APPROVED
      - REGISTER_SUCCEEDED
      - REGISTER_4XX
      - REGISTER_UNKNOWN
      - APP_RESTART
      - RESTART_REVERTED
      - SELLER_CODE_FOUND
      - SELLER_CODE_NOT_FOUND
    StepRunStatus:
      type: string
      description: 단계 실행 상태(ERD step_run.status). 단계 상태 6개 중 NOT_RUN을 뺀 5개
      enum:
      - RUNNING
      - WAITING_INPUT
      - COMPLETED
      - FAILED
      - RERUN_REQUIRED
    StepExecutionMode:
      type: string
      description: 실행 방식(ERD step_run.execution_mode). STEP=단계, CHAIN=연속, BATCH=일괄(M2), CLI=CLI, OWNER_EDIT=오너 수정
      enum:
      - STEP
      - CHAIN
      - BATCH
      - CLI
      - OWNER_EDIT
    StepOwnerAction:
      type: string
      description: 오너 수정 종류(ERD step_run.owner_action). EDIT=값 편집, KEEP_AS_IS=그대로 유지(⑥-1만), RESTORE_VERSION=이전 버전 다시 고르기
      enum:
      - EDIT
      - KEEP_AS_IS
      - RESTORE_VERSION
    StepFailureKind:
      type: string
      description: 실패 종류(ERD step_run.failure_kind). EXTERNAL_API=외부 API 오류, AI=AI 오류, INPUT_VALIDATION=입력 검증 실패, INTERRUPTED=앱 종료로 중단(실패(중단됨))
      enum:
      - EXTERNAL_API
      - AI
      - INPUT_VALIDATION
      - INTERRUPTED
    StepInputSourceType:
      type: string
      description: 입력 출처(ERD step_run_input.source_type). PREV_STEP=앞 단계 산출물 버전, OWNER_INPUT=오너 입력, SETTINGS=설정
      enum:
      - PREV_STEP
      - OWNER_INPUT
      - SETTINGS
    StepChainKind:
      type: string
      description: 연속 실행 종류(ERD step_chain.kind). FROM_HERE=여기부터 연속 실행, RERUN_STALE=재실행 필요 단계 모두 실행
      enum:
      - FROM_HERE
      - RERUN_STALE
    StepChainStopReason:
      type: string
      description: 연속 실행 멈춘 이유(ERD step_chain.stop_reason). AWAIT_G2=③ 국내 기준가·G2, AWAIT_G3=G3(⑧ 앞), AWAIT_G4=G4(끝), NO_RUNNABLE_STEP=더 실행할 단계 없음, APP_RESTART=앱 종료로 중단. 함께 쓰는 stop_step_code(P1-06 Proposed) — AWAIT_G2=PRICING(② 입력 대기면 SOURCING), AWAIT_G3=THUMBNAIL(G3을 고르는 ⑤), AWAIT_G4=REGISTER, NO_RUNNABLE_STEP=흐름 순서로 첫 '완료가 아닌' 필수 단계(막힌 곳), APP_RESTART=묶음의 마지막 실행 단계(없으면 null)
      enum:
      - AWAIT_G2
      - AWAIT_G3
      - AWAIT_G4
      - NO_RUNNABLE_STEP
      - APP_RESTART
    CandidateWarning:
      type: object
      description: 막지 않는 경고(05-1 §5.2). 성공 응답의 warnings[]에 들어간다
      required:
      - code
      - message
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          description: 경고 코드(PRE_G2_AI_COST, CATEGORY_UNDECIDED, ANCHOR_KEY_DUPLICATE 등)
        message:
          type: string
          description: 화면에 그대로 보여 줄 한국어 문구
    CandidateBlockReason:
      type: object
      description: 막힌 이유. code는 같은 동작의 API가 돌려줄 409·422 오류 코드와 같다
      required:
      - code
      - message
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          description: 코드별 부가 정보(stepCode·gate·blockedUntil 등)
    CandidateStepBrief:
      type: object
      required:
      - stepCode
      - status
      properties:
        stepCode:
          $ref: '#/components/schemas/StepCode'
        status:
          $ref: '#/components/schemas/StepStatus'
    CandidateSummary:
      type: object
      description: 후보 목록 한 줄
      required:
      - id
      - creationPath
      - status
      - statusChangedAt
      - excludedReason
      - displayName
      - rakutenQuery
      - anchorModelCode
      - itemCode
      - selectedColor
      - gender
      - resumeStepCode
      - steps
      - createdAt
      - updatedAt
      properties:
        id:
          type: integer
        creationPath:
          $ref: '#/components/schemas/CandidateCreationPath'
        status:
          $ref: '#/components/schemas/CandidateStatus'
        statusChangedAt:
          type: string
          format: date-time
        excludedReason:
          oneOf:
          - $ref: '#/components/schemas/CandidateExcludedReason'
          - type: 'null'
        displayName:
          type:
          - string
          - 'null'
          description: 후보 표시명(예 아식스 젤카야노 14 · 크림/블랙). 소싱 선택 전에는 null
          x-decision: 'S2 결정(ERD v0.3): 컬럼을 두지 않고 현재 ② 버전의 rakuten_item.item_name을 조인해 준다. ②가 없으면 rakutenQuery 또는 null'
        rakutenQuery:
          type:
          - string
          - 'null'
          maxLength: 128
        anchorModelCode:
          type:
          - string
          - 'null'
          maxLength: 128
        itemCode:
          type:
          - string
          - 'null'
          maxLength: 128
        selectedColor:
          type:
          - string
          - 'null'
          maxLength: 128
        gender:
          oneOf:
          - $ref: '#/components/schemas/CandidateGender'
          - type: 'null'
        resumeStepCode:
          description: 이어 할 단계(흐름상 첫 입력대기·미실행·실패·재실행 필요 단계, 계산값). 없으면 null
          oneOf:
          - $ref: '#/components/schemas/StepCode'
          - type: 'null'
        steps:
          type: array
          description: 단계 10개의 상태 요약(candidate_step)
          items:
            $ref: '#/components/schemas/CandidateStepBrief'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CandidatePage:
      type: object
      required:
      - content
      - page
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/CandidateSummary'
        page:
          $ref: '#/components/schemas/PageMeta'
    CandidateStatusCount:
      type: object
      required:
      - status
      - count
      properties:
        status:
          $ref: '#/components/schemas/CandidateStatus'
        count:
          type: integer
          minimum: 0
    CandidateStatusCountList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CandidateStatusCount'
    CandidateResumeTarget:
      type: object
      description: 이어서 할 곳. 단계면 stepCode, 게이트 대기면 gate가 채워진다
      required:
      - candidateId
      - candidateStatus
      - stepCode
      - stepStatus
      - gate
      properties:
        candidateId:
          type: integer
        candidateStatus:
          $ref: '#/components/schemas/CandidateStatus'
        stepCode:
          oneOf:
          - $ref: '#/components/schemas/StepCode'
          - type: 'null'
        stepStatus:
          oneOf:
          - $ref: '#/components/schemas/StepStatus'
          - type: 'null'
        gate:
          type:
          - string
          - 'null'
          enum:
          - G2
          - G3
          - G4
          - null
          description: 대기 중인 게이트
    CandidateGateValidity:
      type: object
      description: G2·G3 최신 통과와 지문 유효(계산값)
      required:
      - gate
      - gatePassId
      - passedAt
      - valid
      properties:
        gate:
          type: string
          enum:
          - G2
          - G3
        gatePassId:
          type:
          - integer
          - 'null'
        passedAt:
          type:
          - string
          - 'null'
          format: date-time
        valid:
          type: boolean
          description: 최신 통과 지문이 현재 값으로 다시 계산한 지문과 같은가. 통과 기록이 없으면 false
    ContinuousRunSummary:
      type: object
      description: 연속 실행 묶음(step_chain)
      required:
      - id
      - candidateId
      - kind
      - startStepCode
      - startedAt
      - endedAt
      - stopReason
      - stopStepCode
      properties:
        id:
          type: integer
          description: stepChainId
        candidateId:
          type: integer
        kind:
          $ref: '#/components/schemas/StepChainKind'
        startStepCode:
          description: 고른 시작 단계(FROM_HERE는 필수)
          oneOf:
          - $ref: '#/components/schemas/StepCode'
          - type: 'null'
        startedAt:
          type: string
          format: date-time
        endedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 진행 중이면 null
        stopReason:
          oneOf:
          - $ref: '#/components/schemas/StepChainStopReason'
          - type: 'null'
        stopStepCode:
          oneOf:
          - $ref: '#/components/schemas/StepCode'
          - type: 'null'
    CandidateDetail:
      type: object
      description: 후보 상세(candidate + 계산값)
      required:
      - id
      - creationPath
      - status
      - statusChangedAt
      - excludedReason
      - displayName
      - sourceKeywordId
      - sourceKeyword
      - rakutenQuery
      - sourceUrl
      - anchorModelCode
      - anchorItemCode
      - anchorColorCode
      - anchorFixedAt
      - itemCode
      - selectedColor
      - gender
      - genderSource
      - genderRecheckRequired
      - leafCategoryId
      - wholeCategoryName
      - noComparisonConfirmedAt
      - locked
      - pageDataCollectedAt
      - pageDataStale
      - gates
      - approvedAt
      - openContinuousRun
      - resumeStepCode
      - createdAt
      - updatedAt
      properties:
        id:
          type: integer
        creationPath:
          $ref: '#/components/schemas/CandidateCreationPath'
        status:
          $ref: '#/components/schemas/CandidateStatus'
        statusChangedAt:
          type: string
          format: date-time
        excludedReason:
          oneOf:
          - $ref: '#/components/schemas/CandidateExcludedReason'
          - type: 'null'
        displayName:
          type:
          - string
          - 'null'
          description: 후보 표시명. 소싱 선택 전에는 null
          x-decision: 'S2 결정(ERD v0.3): 컬럼을 두지 않고 현재 ② 버전의 rakuten_item.item_name을 조인해 준다. ②가 없으면 rakutenQuery 또는 null'
        sourceKeywordId:
          type:
          - integer
          - 'null'
          description: 출처 키워드(G1에서 고른 keyword)
        sourceKeyword:
          type:
          - string
          - 'null'
          maxLength: 100
          description: 출처 키워드 글자(keyword.keyword 조인). 정보로만 표시
        rakutenQuery:
          type:
          - string
          - 'null'
          maxLength: 128
        sourceUrl:
          type:
          - string
          - 'null'
          maxLength: 2048
          description: '''URL로 만들기''에 붙여 넣은 라쿠텐 상품 URL'
        anchorModelCode:
          type:
          - string
          - 'null'
          maxLength: 128
          description: 앵커 型番 정규화값
        anchorItemCode:
          type:
          - string
          - 'null'
          maxLength: 128
          description: 型番이 없을 때의 앵커 itemCode
        anchorColorCode:
          type:
          - string
          - 'null'
          maxLength: 64
        anchorFixedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 앵커 키 확정 시각. 있으면 앵커를 바꿀 수 없다
        itemCode:
          type:
          - string
          - 'null'
          maxLength: 128
          description: 소싱 선택 itemCode
        selectedColor:
          type:
          - string
          - 'null'
          maxLength: 128
        gender:
          oneOf:
          - $ref: '#/components/schemas/CandidateGender'
          - type: 'null'
        genderSource:
          oneOf:
          - $ref: '#/components/schemas/CandidateGenderSource'
          - type: 'null'
        genderRecheckRequired:
          type: boolean
          description: ② 판단이 오너 입력 성별과 다를 때 true
        leafCategoryId:
          type:
          - string
          - 'null'
          maxLength: 20
        wholeCategoryName:
          type:
          - string
          - 'null'
          maxLength: 500
        noComparisonConfirmedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: '''비교 없이 확정'' 체크 시각'
        locked:
          type: boolean
          description: 등록 진행 잠금(계산값 — status가 REGISTERING·RESULT_CHECK_REQUIRED·REGISTERED면 true, F-CW-07)
        pageDataCollectedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 현재 ② 버전 rakuten_item.collected_at
        pageDataStale:
          type: boolean
          description: 페이지 데이터 오래됨(계산값 — collectedAt + 설정 6시간 지남). '재실행 필요'로 바꾸지 않는다(F-CW-20)
        gates:
          type: array
          description: G2·G3 유효성(자세한 것은 GET /candidates/{candidateId}/gates)
          items:
            $ref: '#/components/schemas/CandidateGateValidity'
        approvedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: G4 승인 시각(최신 registration.approved_at, 읽기만)
        openContinuousRun:
          description: 열린 연속 실행(ix_step_chain_open). 없으면 null
          oneOf:
          - $ref: '#/components/schemas/ContinuousRunSummary'
          - type: 'null'
        resumeStepCode:
          description: 이어 할 단계(목록 CandidateSummary.resumeStepCode와 같은 계산 — 흐름상 첫 입력대기·미실행·실패·재실행 필요 단계). 없으면 null
          x-decision: P1-04(Proposed) 후보 틀의 '현재 단계로 이동'(FE CandidateIndexRedirect)이 목록·레일을 따로 읽지 않고 서버의 같은 흐름 순서 함수 값을 쓰도록 더했다(05-1 §7.2 P1-04 결정).
          oneOf:
          - $ref: '#/components/schemas/StepCode'
          - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CandidateCreateKeywordRequest:
      type: object
      description: 키워드로 만들기. G1에서 고른 키워드만(KEYWORD_NOT_SELECTED), 아동화 제외 키워드 불가(KEYWORD_EXCLUDED)
      required:
      - creationPath
      - sourceKeywordId
      - rakutenQuery
      additionalProperties: false
      properties:
        creationPath:
          type: string
          const: KEYWORD
        sourceKeywordId:
          type: integer
          minimum: 1
        rakutenQuery:
          type: string
          minLength: 1
          maxLength: 128
          description: 라쿠텐 검색어(반각 128자 이내)
    CandidateCreateSearchQueryRequest:
      type: object
      description: 검색어로 만들기
      required:
      - creationPath
      - rakutenQuery
      additionalProperties: false
      properties:
        creationPath:
          type: string
          const: SEARCH_QUERY
        rakutenQuery:
          type: string
          minLength: 1
          maxLength: 128
          description: 라쿠텐 검색어(반각 128자 이내)
    CandidateCreateRakutenUrlRequest:
      type: object
      description: 라쿠텐 URL로 만들기. POST /rakuten-items로 먼저 읽은 스냅샷을 쓴다
      required:
      - creationPath
      - rakutenItemId
      - selectedColor
      additionalProperties: false
      properties:
        creationPath:
          type: string
          const: RAKUTEN_URL
        rakutenItemId:
          type: integer
          minimum: 1
          description: rakuten_item.id
        selectedColor:
          type: string
          minLength: 1
          maxLength: 128
    CandidateCreateDirectInputRequest:
      type: object
      description: (M2) 직접 입력으로 임시(TEMP) 후보 만들기. ⑧·⑨ 불가
      x-milestone: M2
      required:
      - creationPath
      additionalProperties: false
      properties:
        creationPath:
          type: string
          const: DIRECT_INPUT
    CandidateCreateRequest:
      description: 후보 만들기 body(표 D). creationPath로 모양이 정해진다
      oneOf:
      - $ref: '#/components/schemas/CandidateCreateKeywordRequest'
      - $ref: '#/components/schemas/CandidateCreateSearchQueryRequest'
      - $ref: '#/components/schemas/CandidateCreateRakutenUrlRequest'
      - $ref: '#/components/schemas/CandidateCreateDirectInputRequest'
      discriminator:
        propertyName: creationPath
        mapping:
          KEYWORD: '#/components/schemas/CandidateCreateKeywordRequest'
          SEARCH_QUERY: '#/components/schemas/CandidateCreateSearchQueryRequest'
          RAKUTEN_URL: '#/components/schemas/CandidateCreateRakutenUrlRequest'
          DIRECT_INPUT: '#/components/schemas/CandidateCreateDirectInputRequest'
    AiEngineCode:
      type: string
      description: AI 엔진(텍스트·비전 작업을 하는 로컬 CLI, D-16). CLAUDE=Claude Code(claude), AGY=Antigravity CLI(agy), CODEX=Codex(codex). 표시 순서도 이 순서. 이미지 생성 공급자(generation_run.provider)와 섞지 않는다
      enum:
      - CLAUDE
      - AGY
      - CODEX
    StepRunInputItem:
      type: object
      description: 실행이 읽은 입력 하나의 출처(step_run_input)
      required:
      - inputKey
      - sourceType
      - sourceStepRunId
      - isStartCondition
      - valueHash
      properties:
        inputKey:
          type: string
          maxLength: 64
          description: 입력 이름(예 candidate.gender, owner.domesticPrice)
        sourceType:
          $ref: '#/components/schemas/StepInputSourceType'
        sourceStepRunId:
          type:
          - integer
          - 'null'
          description: PREV_STEP일 때 읽은 앞 단계 버전
        isStartCondition:
          type: boolean
          description: true=시작 조건(지문 포함), false=실행 중 오너 입력
        valueHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        directInputId:
          type:
          - integer
          - 'null'
          description: (M2) 직접 입력 입구 값 출처(ERD §6.2)
    StepRunSummary:
      type: object
      description: 단계 실행 한 번(step_run)
      required:
      - id
      - candidateId
      - stepCode
      - version
      - executionMode
      - ownerAction
      - baseStepRunId
      - stepChainId
      - settingsSnapshotId
      - aiEngine
      - aiModel
      - aiCliVersion
      - status
      - failureKind
      - errorCode
      - errorMessage
      - rerunReasonInputs
      - waitingSince
      - waitSecondsTotal
      - startedAt
      - endedAt
      properties:
        id:
          type: integer
          description: stepRunId
        candidateId:
          type: integer
        stepCode:
          $ref: '#/components/schemas/StepCode'
        version:
          type: integer
          minimum: 1
        executionMode:
          $ref: '#/components/schemas/StepExecutionMode'
        ownerAction:
          oneOf:
          - $ref: '#/components/schemas/StepOwnerAction'
          - type: 'null'
        baseStepRunId:
          type:
          - integer
          - 'null'
          description: 바탕 버전(오너 수정·그대로 유지·다시 고른 버전)
        stepChainId:
          type:
          - integer
          - 'null'
          description: 연속 실행 묶음(CHAIN일 때)
        settingsSnapshotId:
          type: integer
        aiEngine:
          description: 실행 시작 때 고정한 AI 엔진(step_run.ai_engine, D-16 R11). AI를 쓰지 않은 단계는 null
          oneOf:
          - $ref: '#/components/schemas/AiEngineCode'
          - type: 'null'
        aiModel:
          type:
          - string
          - 'null'
          maxLength: 100
          description: 실행 시작 때 쓴 모델(--model 값). aiEngine이 null이면 null
        aiCliVersion:
          type:
          - string
          - 'null'
          maxLength: 40
          description: 실행 시작 때 CLI 버전(--version 결과). aiEngine이 null이면 null
        status:
          $ref: '#/components/schemas/StepRunStatus'
        failureKind:
          oneOf:
          - $ref: '#/components/schemas/StepFailureKind'
          - type: 'null'
        errorCode:
          type:
          - string
          - 'null'
          maxLength: 100
        errorMessage:
          type:
          - string
          - 'null'
          description: 한국어 안내 문구(비밀정보 없음)
        rerunReasonInputs:
          type: array
          description: 끝날 때 지문이 달라 RERUN_REQUIRED가 된 경우 바뀐 입력 이름
          items:
            type: string
            maxLength: 64
        waitingSince:
          type:
          - string
          - 'null'
          format: date-time
          description: 현재 입력 대기 시작 시각
        waitSecondsTotal:
          type: integer
          minimum: 0
          description: 입력 대기 누적 초
        startedAt:
          type: string
          format: date-time
        endedAt:
          type:
          - string
          - 'null'
          format: date-time
    StepRunVersionItem:
      description: 버전 이력 한 줄
      allOf:
      - $ref: '#/components/schemas/StepRunSummary'
      - type: object
        required:
        - isCurrent
        properties:
          isCurrent:
            type: boolean
            description: candidate_step.current_step_run_id와 같은가
    StepRunVersionPage:
      type: object
      required:
      - content
      - page
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/StepRunVersionItem'
        page:
          $ref: '#/components/schemas/PageMeta'
    StepRunDetail:
      description: 단계 실행 한 건과 입력 출처
      allOf:
      - $ref: '#/components/schemas/StepRunSummary'
      - type: object
        required:
        - isCurrent
        - inputs
        properties:
          isCurrent:
            type: boolean
          inputs:
            type: array
            items:
              $ref: '#/components/schemas/StepRunInputItem'
    StepActionState:
      type: object
      description: 버튼 하나의 켜짐과 꺼진 이유
      required:
      - enabled
      - disabledReason
      properties:
        enabled:
          type: boolean
        disabledReason:
          oneOf:
          - $ref: '#/components/schemas/CandidateBlockReason'
          - type: 'null'
    CandidateStepActions:
      type: object
      required:
      - run
      - continuousRun
      - edit
      properties:
        run:
          $ref: '#/components/schemas/StepActionState'
        continuousRun:
          $ref: '#/components/schemas/StepActionState'
        edit:
          $ref: '#/components/schemas/StepActionState'
    CandidateStepRailItem:
      type: object
      description: 단계 레일 한 칸(candidate_step + 현재 step_run + step_run_input)
      required:
      - id
      - stepCode
      - status
      - currentStepRunId
      - lastVersion
      - staleInputs
      - staleSince
      - updatedAt
      - currentRun
      - inputs
      - actions
      - warnings
      properties:
        id:
          type: integer
          description: candidate_step.id
        stepCode:
          $ref: '#/components/schemas/StepCode'
        status:
          $ref: '#/components/schemas/StepStatus'
        currentStepRunId:
          type:
          - integer
          - 'null'
          description: 현재 버전. NOT_RUN이면 null
        lastVersion:
          type: integer
          minimum: 0
        staleInputs:
          type: array
          description: 재실행 필요 사유 = 바뀐 입력 이름
          items:
            type: string
            maxLength: 64
        staleSince:
          type:
          - string
          - 'null'
          format: date-time
        updatedAt:
          type: string
          format: date-time
        currentRun:
          description: 현재 버전 실행. NOT_RUN이면 null
          oneOf:
          - $ref: '#/components/schemas/StepRunSummary'
          - type: 'null'
        inputs:
          type: array
          description: 현재 버전의 입력 출처
          items:
            $ref: '#/components/schemas/StepRunInputItem'
        actions:
          $ref: '#/components/schemas/CandidateStepActions'
        warnings:
          type: array
          description: G2 전 AI 비용 경고(PRE_G2_AI_COST) 등
          items:
            $ref: '#/components/schemas/CandidateWarning'
    CandidateStepRail:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 10
          maxItems: 10
          items:
            $ref: '#/components/schemas/CandidateStepRailItem'
    StepRunOwnerInputs:
      type: object
      description: 실행 중 오너 입력(표 A). 입력 지문에서 뺀다. 단계에 맞지 않는 키는 422 VALIDATION_FAILED
      additionalProperties: false
      properties:
        searchKeyword:
          type: string
          minLength: 1
          maxLength: 128
          description: SOURCING — 라쿠텐 검색어(sourcing_comparison.search_keyword). 없으면 후보 검색어·앵커
        couponYen:
          type: integer
          minimum: 0
          description: PRICING — 쿠폰 엔(pricing_coupon_input.coupon_yen). 비교표 없는 URL 후보만, 그 밖은 422 COUPON_NOT_ALLOWED
        faceOption:
          type: string
          enum:
          - FULL_FACE
          - CHIN_CROP
          - HANDS_UPPER_BODY
          description: THUMBNAIL — 얼굴 옵션(generation_run.face_option)
        promptAdjustment:
          type: string
          minLength: 1
          description: THUMBNAIL — 프롬프트 조정 문구. generation_run.prompt에 반영하고 prompt_adjusted=true
    StepRunStartRequest:
      type: object
      description: 단계 실행 body(표 A)
      additionalProperties: false
      properties:
        ownerInputs:
          $ref: '#/components/schemas/StepRunOwnerInputs'
        throughStepCode:
          type: string
          const: NOTICE_HTML
          description: stepCode=COPY일 때만. ⑥-1→⑥-2→⑥-3을 이어서 돌린다
    StepRunAccepted:
      type: object
      description: 202 수락 본문. 실행 기록 id와 상태
      required:
      - stepRunId
      - stepRunIds
      - candidateId
      - stepCode
      - version
      - executionMode
      - aiEngine
      - aiModel
      - aiCliVersion
      - status
      - warnings
      properties:
        stepRunId:
          type: integer
          description: 곧바로 만든 실행
        stepRunIds:
          type: array
          description: 이번 요청으로 만든 실행 id(⑥ 묶음은 첫 실행만, 나머지는 SSE)
          items:
            type: integer
        candidateId:
          type: integer
        stepCode:
          $ref: '#/components/schemas/StepCode'
        version:
          type: integer
          minimum: 1
        executionMode:
          description: 단계 실행·재조회는 STEP, 태그 오너 수정은 OWNER_EDIT
          allOf:
          - $ref: '#/components/schemas/StepExecutionMode'
        aiEngine:
          description: 곧바로 만든 실행(stepRunId)에 고정한 AI 엔진(D-16 R11). AI를 쓰지 않는 단계는 null
          oneOf:
          - $ref: '#/components/schemas/AiEngineCode'
          - type: 'null'
        aiModel:
          type:
          - string
          - 'null'
          maxLength: 100
          description: 실행 시작 때 쓴 모델(--model 값). aiEngine이 null이면 null
        aiCliVersion:
          type:
          - string
          - 'null'
          maxLength: 40
          description: 실행 시작 때 CLI 버전(--version 결과). aiEngine이 null이면 null
        status:
          type: string
          const: RUNNING
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/CandidateWarning'
    StepStaleInputDiff:
      type: object
      description: 입력 하나의 쓴 버전과 지금 버전
      required:
      - inputKey
      - sourceType
      - changed
      - usedSourceStepRunId
      - currentSourceStepRunId
      - usedValueHash
      - currentValueHash
      properties:
        inputKey:
          type: string
          maxLength: 64
        sourceType:
          $ref: '#/components/schemas/StepInputSourceType'
        changed:
          type: boolean
        usedSourceStepRunId:
          type:
          - integer
          - 'null'
          description: 쓴 앞 단계 버전(PREV_STEP)
        currentSourceStepRunId:
          type:
          - integer
          - 'null'
          description: 지금 앞 단계 버전(PREV_STEP)
        usedValueHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        currentValueHash:
          type: string
          pattern: ^[0-9a-f]{64}$
    StepStaleDiff:
      type: object
      required:
      - candidateId
      - stepCode
      - status
      - stepRunId
      - staleInputs
      - staleSince
      - keepAsIsAllowed
      - inputs
      properties:
        candidateId:
          type: integer
        stepCode:
          $ref: '#/components/schemas/StepCode'
        status:
          $ref: '#/components/schemas/StepStatus'
        stepRunId:
          type: integer
          description: 재실행 필요가 된 현재 버전
        staleInputs:
          type: array
          items:
            type: string
            maxLength: 64
        staleSince:
          type:
          - string
          - 'null'
          format: date-time
        keepAsIsAllowed:
          type: boolean
          description: COPY일 때만 true
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/StepStaleInputDiff'
    OwnerEditFieldInput:
      type: object
      description: 필드 하나의 오너 입력(content_draft_field)
      required:
      - fieldKey
      additionalProperties: false
      properties:
        fieldKey:
          type: string
          maxLength: 48
          pattern: ^((copy|fact|notice)\.[a-z0-9_.]+|product_name)$
          description: content_draft_field.field_key 형식(copy.*·fact.*·notice.*·product_name). 허용 키 목록은 앱 상수
        value:
          description: 새 값(content_draft_field.value, 문서형)
        evidenceUrl:
          type: string
          format: uri
          maxLength: 2048
          description: 근거 URL
        choose:
          type: string
          enum:
          - OWNER
          - GENERATED
          description: 나란히 고르기 — 오너 값 또는 단계 결과 값
        recheckConfirmed:
          type: boolean
          description: '''재확인 필요''를 확인했다'
    StepOwnerEditFieldsRequest:
      type: object
      description: EDIT(COPY·NOTICE_RAW·NOTICE_HTML) — 필드 값 편집
      required:
      - ownerAction
      - baseStepRunId
      - fields
      additionalProperties: false
      properties:
        ownerAction:
          type: string
          const: EDIT
        baseStepRunId:
          type: integer
          minimum: 1
          description: 화면이 본 현재 버전
        fields:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OwnerEditFieldInput'
    StepOwnerEditTagsRequest:
      type: object
      description: EDIT(TAGS) — 태그 추가·삭제. 202로 받는다
      required:
      - ownerAction
      - baseStepRunId
      - add
      - remove
      additionalProperties: false
      properties:
        ownerAction:
          type: string
          const: EDIT
        baseStepRunId:
          type: integer
          minimum: 1
        add:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
        remove:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
    StepOwnerKeepAsIsRequest:
      type: object
      description: KEEP_AS_IS — RERUN_REQUIRED인 COPY만
      required:
      - ownerAction
      - baseStepRunId
      additionalProperties: false
      properties:
        ownerAction:
          type: string
          const: KEEP_AS_IS
        baseStepRunId:
          type: integer
          minimum: 1
          description: 현재 버전
    StepOwnerRestoreVersionRequest:
      type: object
      description: RESTORE_VERSION — 이전 완료 버전 다시 고르기
      required:
      - ownerAction
      - baseStepRunId
      additionalProperties: false
      properties:
        ownerAction:
          type: string
          const: RESTORE_VERSION
        baseStepRunId:
          type: integer
          minimum: 1
          description: 다시 고를 이전 완료 버전
    StepOwnerEditRequest:
      description: 오너 수정 body(표 B)
      oneOf:
      - $ref: '#/components/schemas/StepOwnerEditFieldsRequest'
      - $ref: '#/components/schemas/StepOwnerEditTagsRequest'
      - $ref: '#/components/schemas/StepOwnerKeepAsIsRequest'
      - $ref: '#/components/schemas/StepOwnerRestoreVersionRequest'
    StepOwnerEditResult:
      type: object
      description: 오너 수정으로 만든 새 버전
      required:
      - stepRunId
      - candidateId
      - stepCode
      - version
      - executionMode
      - ownerAction
      - baseStepRunId
      - status
      - staleDownstreamSteps
      - propagatedSteps
      - warnings
      properties:
        stepRunId:
          type: integer
        candidateId:
          type: integer
        stepCode:
          $ref: '#/components/schemas/StepCode'
        version:
          type: integer
          minimum: 1
        executionMode:
          type: string
          const: OWNER_EDIT
        ownerAction:
          $ref: '#/components/schemas/StepOwnerAction'
        baseStepRunId:
          type: integer
        status:
          $ref: '#/components/schemas/StepRunStatus'
        staleDownstreamSteps:
          type: array
          description: 이번 수정으로 재실행 필요가 된 뒷단계
          items:
            $ref: '#/components/schemas/StepCode'
        propagatedSteps:
          type: array
          description: RESTORE_VERSION이 뒷단계로 전파해 재실행 필요가 된 단계(staleDownstreamSteps와 같다). 그 밖 동작은 빈 배열(P1-05 Proposed — 다른 단계를 함께 되돌리지 않는다)
          items:
            $ref: '#/components/schemas/StepCode'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/CandidateWarning'
    ContinuousRunStartRequest:
      type: object
      description: 연속 실행 body. FROM_HERE는 startStepCode 필수(표의 fromStep, ERD step_chain.start_step_code)
      required:
      - kind
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/StepChainKind'
        startStepCode:
          type: string
          enum:
          - SOURCING
          - PRICING
          - CATEGORY
          - THUMBNAIL
          - COPY
          - NOTICE_RAW
          - NOTICE_HTML
          - TAGS
          - UPLOAD
          description: 시작 단계. G2 전에는 SOURCING·PRICING만(409 CONTINUOUS_RUN_BEFORE_G2)
      if:
        properties:
          kind:
            const: FROM_HERE
        required:
        - kind
      then:
        required:
        - startStepCode
        properties:
          startStepCode:
            $ref: '#/components/schemas/StepCode'
    ContinuousRunAccepted:
      type: object
      description: 202 수락 본문. 묶음 id와 상태, 곧바로 시작한 단계 실행
      required:
      - stepChainId
      - candidateId
      - kind
      - startStepCode
