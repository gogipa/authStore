      - $ref: '#/components/schemas/SettingsSnapshot'
      - type: object
        required:
        - valid
        - errors
        properties:
          valid:
            type: boolean
            description: 지금 설정 파일이 검사를 통과하는지(false면 이 스냅샷은 마지막으로 통과한 것)
          errors:
            type: array
            description: 검사 오류(field = JSON 경로)
            items:
              $ref: '#/components/schemas/FieldError'
    SettingsSnapshotPage:
      type: object
      required:
      - content
      - page
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SettingsSnapshot'
        page:
          $ref: '#/components/schemas/PageMeta'
    SettingsReloadResult:
      type: object
      description: 설정 다시 읽기·섹션 저장 결과(SSE settings.reloaded와 같은 뜻)
      required:
      - snapshot
      - created
      - changedKeys
      - rerunRequiredStepCount
