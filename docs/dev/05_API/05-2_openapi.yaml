  /commerce-meta-sync-runs:
    post:
      operationId: createCommerceMetaSyncRuns
      summary: 메타데이터 지금 동기화
      description: '`targets[]`(없으면 전체) 대상별로 run 행(RUNNING)을 만들고 202를 준다. 하루 1회 자동 실행과 같은 서비스다.

        완료는 대상마다 SSE `commerce-meta-sync.completed`로 알린다.

        Proposed(P1-08, 05-1 §2.13) — 검사 순서는 본문(422) → 진행 중(409 ALREADY_IN_PROGRESS, details.job=META_SYNC·targets[]=요청 대상 중 RUNNING인 것) → 커머스 키(409 SECRET_NOT_CONFIGURED, 키체인 오류 503). 대상은 enum 순서로 하나씩 돈다(CATEGORY 먼저, 커머스API 호출이 겹치지 않는다). 대상 하나는 외부 응답을 모두 받은 뒤 캐시 쓰기·removedAt 표시·run SUCCEEDED를 한 트랜잭션으로 하고, 실패하면 run만 FAILED(errorMessage)이고 이전 캐시는 그대로다. 대상 하나가 실패해도 나머지는 계속한다. 다만 키 없음·키체인·인증 실패(COMMERCE_AUTH_FAILED)면 남은 대상은 부르지 않고 같은 사유로 FAILED. CATEGORY_DETAIL·STANDARD_OPTIONS·PRODUCT_ATTRIBUTES는 캐시의 성별 신발 리프(패션잡화>남성신발>·패션잡화>여성신발>, removedAt 없음)만 부른다. 하루 1회 자동 실행은 대상마다 오늘(KST) 끝난 SUCCEEDED가 없으면 돌린다(앱 시작 10초 뒤·매시간 확인, 실패한 대상은 시작 6시간 뒤 다시, 커머스 키가 없으면 조용히 건너뜀).

        '
      tags:
      - integrations
      x-milestone: M1
      x-features:
      - F-SY-03
      - F-BS-48
      parameters:
      - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommerceMetaSyncRequest'
      responses:
        '202':
          description: 대상별 동기화 실행 기록(RUNNING)
          headers:
            Location:
              description: 진행 조회 경로(/commerce-meta-sync-runs/latest)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommerceMetaSyncAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
          description: ALREADY_IN_PROGRESS(details.job=META_SYNC, details.targets=진행 중 대상) · SECRET_NOT_CONFIGURED(커머스 키 없음, details.secretKeys)
